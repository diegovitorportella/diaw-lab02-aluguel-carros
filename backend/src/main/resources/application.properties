spring.application.name=driveja

# Ativa o arquivo application-dev.properties localmente
spring.profiles.active=dev

# Configurações do JPA/Hibernate (Públicas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# JWT (defina JWT_SECRET com pelo menos 32 caracteres; sem ela, uma chave aleatória é gerada a cada execução)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480
