spring.application.name=driveja

# Ativa o arquivo application-dev.properties localmente
spring.profiles.active=dev

# Configurações do JPA/Hibernate (Públicas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Carrega associações/coleções em lotes (evita N+1 consultas, caras com o banco remoto)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Publicação: porta fornecida pela hospedagem e origens permitidas (CORS), separadas por vírgula
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8443}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Senha dos agentes de demonstração criados no perfil "dev" ou "seed" (defina SEED_SENHA fora do desenvolvimento)
app.seed.senha=${SEED_SENHA:password123}
# JWT (defina JWT_SECRET com pelo menos 32 caracteres; sem ela, uma chave aleatória é gerada a cada execução)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=480
